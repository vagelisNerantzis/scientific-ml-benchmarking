[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-ml-benchmarking"
version = "0.1.0"
description = "Leakage-safe physical-sample evaluation for scientific classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
                "joblib>=1.3", "matplotlib>=3.7", "Pillow>=10", "tqdm>=4.65", "PyYAML>=6"]

[project.optional-dependencies]
image = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0"]
telemetry = ["nvidia-ml-py>=12"]
research = ["xgboost>=2", "tifffile>=2023.1", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
